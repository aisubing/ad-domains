name: Sync Domains

on:
  schedule:
    # GitHub Actions 定时任务使用 UTC：每天 18:00 UTC = 北京时间次日凌晨 02:00。
    # 源列表每 8 小时更新一次，如需更高同步频率可自行修改。
    - cron: "0 18 * * 1"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: sync-domains
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract domains
        run: python scripts/extract_domains.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "输出无变化，跳过提交"
          else
            count=$(python -c 'import json; print(json.load(open("output/stats.json"))["counts"]["final_domains"])')
            git commit -m "chore(sync): $(date -u +%F) 共 ${count} 个域名"
            git push
          fi
